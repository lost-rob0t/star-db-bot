name: Docker
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@v31
      - name: Build the tested Nix runtime closure into a container
        run: docker build -t database-actor:validation .
      - name: Test container with actual local CouchDB and StarRouter
        run: |
          nix develop --no-update-lock-file --command bash -c '
            python3 tests/installed_actor.py tests/container-launcher.sh \
              "$(command -v starRouter)" "$(dirname "$(dirname "$(command -v couchdb)")")"
          '
